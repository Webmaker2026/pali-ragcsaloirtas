<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <title>A-Leco — temporary responsive QA</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#ddd;font:14px system-ui}
    header{padding:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    button,input,select{font:inherit;padding:8px}input{width:440px}
    iframe{display:block;margin:0 8px;border:0;width:390px;height:780px;background:#fff}
    output{padding:0 8px;display:block}main{overflow:auto}
  </style>
</head>
<body>
  <header>
    <button data-width="375">375 px</button>
    <button data-width="390">390 px</button>
    <button data-width="430">430 px</button>
    <button data-width="1280">1280 px</button>
    <label>Oldal <select id="route">
      <option value="/index.html">Főoldal</option>
      <option value="/adatkezeles.html">Adatkezelés</option>
      <option value="/cookie-tajekoztato.html">Cookie tájékoztató</option>
      <option value="/koszonjuk.html">Köszönőoldal</option>
      <option value="/404.html">404</option>
    </select></label>
    <label>Preview <input id="origin" type="url" placeholder="https://…vercel.app"></label>
    <button id="load">Megnyitás</button>
  </header>
  <output id="dimensions">Viewport: 390 × 780 CSS px</output>
  <main><iframe id="site" title="Ellenőrzött weboldal" src="/index.html"></iframe></main>
  <script>
    const frame=document.getElementById('site');
    document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{
      frame.style.width=button.dataset.width+'px';
      document.getElementById('dimensions').textContent='Viewport: '+button.dataset.width+' × 780 CSS px';
    }));
    function load(){
      const entered=document.getElementById('origin').value.trim();
      const origin=entered?new URL(entered).origin:location.origin;
      if(!origin.endsWith('.vercel.app') && origin!==location.origin) return;
      frame.src=origin+document.getElementById('route').value;
    }
    document.getElementById('load').addEventListener('click',load);
    document.getElementById('route').addEventListener('change',load);
  </script>
</body>
</html>
